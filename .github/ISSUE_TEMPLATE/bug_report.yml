name: 问题反馈
description: 报告无法识别、字幕错位、安装或界面等问题。
title: "[问题] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        只需描述遇到的问题；如果知道操作过程、报错或希望得到的结果，可以一起写在下面。
        **反馈会公开显示在 GitHub。** 请先遮盖个人信息，不要提交 API Key、私人音视频、完整项目或资源库。
  - type: textarea
    id: problem
    attributes:
      label: 遇到了什么问题？
      placeholder: 例如：项目能拖入，但点击「生成字幕」后提示无法识别。报错是……，我希望……
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 截图（可选）
      description: 在此粘贴或拖入 PNG、JPEG、WebP 静态截图，单张不超过 10 MB；图片在粘贴或拖入后上传。
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: 使用环境（可选）
      description: 从插件打开时会自动填写 SubPop 版本、Build、macOS 和处理器类型；知道 FCP 版本时也可补充。
    validations:
      required: false
